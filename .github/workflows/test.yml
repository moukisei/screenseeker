name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[web,dev]'

    - name: Run tests with pytest
      run: |
        pytest --verbose --tb=short

  test-with-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies with coverage
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[web,dev]'

    - name: Run tests with coverage
      run: |
        pytest --cov=. --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[web,dev]'

    # Explicit paths, not `.`: the repo root also holds output/, tmp/ and
    # htmlcov/, and a stray script there should not decide whether CI is green.
    - name: Run ruff linter
      run: |
        ruff check src tests migrations

    - name: Run ruff formatter check
      run: |
        ruff format --check src tests migrations

    - name: Run isort check
      run: |
        isort --check-only --diff src tests migrations

    # Same flags and paths as the pre-commit hooks, so a push cannot fail on
    # something a commit let through.
    - name: Run mypy
      run: |
        mypy --ignore-missing-imports --check-untyped-defs src migrations

    - name: Run bandit
      run: |
        bandit -c pyproject.toml -r src migrations
