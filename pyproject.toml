[project]
name = "screenseeker"
version = "0.1.0"
description = "Find where to watch films from your Letterboxd watchlist"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "beautifulsoup4 (>=4.14.2,<5.0.0)",
    "feedparser (>=6.0.12,<7.0.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "ruff (>=0.14.3,<0.15.0)",
    "isort (>=7.0.0,<8.0.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "click (>=8.3.0,<9.0.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]

[project.scripts]
screenseeker = "cli:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
