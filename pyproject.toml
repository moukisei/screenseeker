[project]
name = "screenseeker"
version = "0.1.0"
description = "Find where to watch films from your Letterboxd watchlist"
authors = [
    {name = "Mouktar ABDILLAHI",email = "mouktar.abdillahi1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "beautifulsoup4 (>=4.14.2,<5.0.0)",
    "feedparser (>=6.0.12,<7.0.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "ruff (>=0.14.3,<0.15.0)",
    "isort (>=7.0.0,<8.0.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "click (>=8.3.0,<9.0.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]

[tool.poetry]
license = "Apache-2.0"
packages = [
    { include = "screenseeker", from = "src" }
]

[project.scripts]
screenseeker = "screenseeker.cli:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.14"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false
no_implicit_optional = false
strict_optional = false
warn_no_return = false
exclude = [
    "^tests/",
    "^.venv/",
]

# Disable specific checks that are too strict for this codebase
[[tool.mypy.overrides]]
module = [
    "screenseeker.database.*",
    "screenseeker.enrichers.*",
    "screenseeker.scrapers.*",
    "screenseeker.exporters.*",
    "screenseeker.cli",
    "screenseeker.logger",
    "screenseeker.config",
    "screenseeker.models",
    "screenseeker.enrich",
    "screenseeker.exceptions",
]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by formatter
    "C901",  # function is too complex (we'll handle refactoring later)
]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # Skip assert_used check (used in tests)
